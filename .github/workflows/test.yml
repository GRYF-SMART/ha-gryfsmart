name: Test integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.6.3'
          - python: '3.14'
            homeassistant: 'latest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ '${{ matrix.homeassistant }}' = latest ]; then
            python -m pip install homeassistant pyserial-asyncio-fast==0.16 ruff
          else
            python -m pip install homeassistant==${{ matrix.homeassistant }} 'pycares<5' pyserial-asyncio-fast==0.16 ruff
          fi
      - name: Install matching HA frontend for panel runtime tests
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, homeassistant
          manifest = pathlib.Path(homeassistant.__file__).parent / 'components/frontend/manifest.json'
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *json.loads(manifest.read_text())['requirements']])
          PY
      - run: ruff check .
      - run: python -m unittest discover -s tests -t . -v
