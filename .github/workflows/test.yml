name: Test integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.6.3'
          - python: '3.14'
            homeassistant: 'latest'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ '${{ matrix.homeassistant }}' = latest ]; then
            python -m pip install homeassistant pyserial-asyncio-fast==0.16 ruff
          else
            python -m pip install homeassistant==${{ matrix.homeassistant }} pyserial-asyncio-fast==0.16 ruff
          fi
      - run: ruff check .
      - run: python -m unittest discover -s tests -t . -v
