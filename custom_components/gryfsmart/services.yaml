pulse:
  name: Impuls wyjścia
  description: Załącza wyjście na zadany czas odmierzany przez moduł. Nie przedłuża trwającego chronionego impulsu.
  target:
    entity:
      integration: gryfsmart
      domain: switch
  fields:
    duration:
      name: Czas impulsu
      required: true
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
          mode: box
